spring:
  application:
    name: herald-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HERALD_DB_URL:jdbc:postgresql://localhost:5432/herald}
    username: ${HERALD_DB_USER:herald}
    password: ${HERALD_DB_PASSWORD:herald}
    hikari:
      maximum-pool-size: ${HERALD_DB_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${HERALD_REDIS_HOST:localhost}
      port: ${HERALD_REDIS_PORT:6379}
      ssl:
        enabled: ${HERALD_REDIS_TLS:false}
      timeout: 200ms
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Secrets have no defaults on purpose: they must come from the environment
# (Kubernetes Secret / AWS Secrets Manager). See deploy/.env.example for local dev.
herald:
  admin-token: ${HERALD_ADMIN_TOKEN}
  secrets:
    encryption-key: ${HERALD_ENCRYPTION_KEY}
  endpoints:
    allow-private-networks: ${HERALD_ALLOW_PRIVATE_NETWORKS:false}
    require-https: ${HERALD_REQUIRE_HTTPS:true}
    max-per-tenant: 100
  tenant-defaults:
    rate-limit-per-second: 50
    rate-limit-burst: 100
    max-concurrency: 20
  events:
    max-payload-bytes: 262144
  cors:
    allowed-origins: ${HERALD_CORS_ORIGINS:http://localhost:3000}

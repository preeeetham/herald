spring:
  application:
    name: herald-worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HERALD_DB_URL:jdbc:postgresql://localhost:5432/herald}
    username: ${HERALD_DB_USER:herald}
    password: ${HERALD_DB_PASSWORD:herald}
    hikari:
      maximum-pool-size: ${HERALD_DB_POOL_SIZE:20}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Local Kubernetes (kind / k3s): in-cluster Postgres, Redis and ElasticMQ from deploy/k8s-local/.
image:
  registry: herald
  tag: local
  pullPolicy: Never
config:
  database: { url: jdbc:postgresql://postgres:5432/herald, user: herald }
  redis: { host: redis }
  sqs: { endpoint: http://elasticmq:9324, createIfMissing: true }
  allowPrivateNetworks: true
  requireHttps: false
  extraEnv:
    - { name: AWS_ACCESS_KEY_ID, value: local }
    - { name: AWS_SECRET_ACCESS_KEY, value: local }
api:
  autoscaling: { enabled: false }
  replicas: 1
  resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 640Mi } }
worker:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 640Mi } }
dashboard:
  replicas: 1
podDisruptionBudget:
  minAvailable: 0

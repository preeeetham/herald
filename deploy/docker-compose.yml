# Local Herald stack: docker compose -f deploy/docker-compose.yml up --build
# Run scripts/dev-env.sh first to create deploy/.env with local secrets.
name: herald

x-secrets: &secrets
  HERALD_ADMIN_TOKEN: ${HERALD_ADMIN_TOKEN:?run scripts/dev-env.sh}
  HERALD_ENCRYPTION_KEY: ${HERALD_ENCRYPTION_KEY:?run scripts/dev-env.sh}

x-common: &common
  HERALD_DB_URL: jdbc:postgresql://postgres:5432/herald
  HERALD_DB_USER: herald
  HERALD_DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh}
  HERALD_ALLOW_PRIVATE_NETWORKS: "true"   # local receivers live on the compose network
  HERALD_TRACING_ENABLED: "true"
  HERALD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: herald
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  sqs:
    image: softwaremill/elasticmq-native:1.6.14

  api:
    build: { context: .., args: { MODULE: herald-api } }
    environment:
      <<: [*secrets, *common]
      HERALD_REDIS_HOST: redis
      HERALD_REQUIRE_HTTPS: "false"
      HERALD_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      retries: 30

  worker:
    build: { context: .., args: { MODULE: herald-worker } }
    environment:
      <<: [*secrets, *common]
      HERALD_SQS_ENDPOINT: http://sqs:9324
      HERALD_CREATE_QUEUE: "true"
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: local       # ElasticMQ ignores credentials
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      api: { condition: service_healthy }   # the API owns the schema migrations
      sqs: { condition: service_started }

  # Programmable webhook receiver for demos: /status/200, /status/503, /delay/3 ...
  receiver:
    image: mccutchen/go-httpbin:latest
    ports: ["8089:8080"]

  prometheus:
    image: prom/prometheus:latest
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

  jaeger:
    image: jaegertracing/jaeger:latest
    ports: ["16686:16686"]

volumes:
  postgres-data:

# Development-only stand-ins for RDS, ElastiCache and SQS on a local cluster.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: herald }
            - { name: POSTGRES_USER, value: herald }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: herald-secrets, key: HERALD_DB_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, herald] }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - { name: redis, image: "redis:8-alpine", ports: [{ containerPort: 6379 }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: elasticmq }
spec:
  selector: { matchLabels: { app: elasticmq } }
  template:
    metadata: { labels: { app: elasticmq } }
    spec:
      containers:
        - { name: elasticmq, image: "softwaremill/elasticmq-native:1.6.14", ports: [{ containerPort: 9324 }] }
---
apiVersion: v1
kind: Service
metadata: { name: elasticmq }
spec: { selector: { app: elasticmq }, ports: [{ port: 9324 }] }
---
# Mock webhook receiver for demos (go-httpbin).
apiVersion: apps/v1
kind: Deployment
metadata: { name: receiver }
spec:
  selector: { matchLabels: { app: receiver } }
  template:
    metadata: { labels: { app: receiver } }
    spec:
      containers:
        - { name: receiver, image: "mccutchen/go-httpbin:latest", imagePullPolicy: IfNotPresent, ports: [{ containerPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: receiver }
spec: { selector: { app: receiver }, ports: [{ port: 8080 }] }
